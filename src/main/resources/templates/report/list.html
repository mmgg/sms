<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>诊所管理系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background: #f0f2f5; display: flex; min-height: 100vh; }
.sidebar { width:220px; background:#001529; color:#fff; position:fixed; top:0; left:0; bottom:0; display:flex; flex-direction:column; }
.sidebar .logo { padding:20px; font-size:18px; font-weight:600; border-bottom:1px solid rgba(255,255,255,0.1); text-align:center; }
.sidebar .logo span { color:#1890ff; }
.sidebar nav { flex:1; padding:12px 0; }
.sidebar nav a { display:block; padding:14px 24px; color:rgba(255,255,255,0.65); text-decoration:none; font-size:14px; transition:all 0.2s; }
.sidebar nav a:hover, .sidebar nav a.active { color:#fff; background:rgba(255,255,255,0.08); }
.sidebar nav a.active { border-right:3px solid #1890ff; }
.sidebar .logout { padding:16px 20px; border-top:1px solid rgba(255,255,255,0.1); }
.sidebar .logout a { color:rgba(255,255,255,0.45); text-decoration:none; font-size:13px; }
.main { margin-left:220px; flex:1; padding:24px; }
.card { background:#fff; border-radius:8px; padding:24px; box-shadow:0 1px 4px rgba(0,0,0,0.05); }
.card h2 { font-size:18px; color:#333; margin-bottom:16px; }
.placeholder { text-align:center; padding:60px 0; color:#999; font-size:16px; }
</style></head>
<body>
<aside class="sidebar">
<div class="logo">诊所<span>管理</span></div>
<nav>
<a href="/dashboard">📊 仪表盘</a>
<a href="/patients" class="active">👤 患者管理</a>
<a href="/physic">💊 药品/耗材</a>
<a href="/purchase">📦 进货管理</a>
<a href="/prescription">📋 处方管理</a>
<a href="/inventory">🏪 库存查询</a>
<a href="/selling-price">💰 售价管理</a>
<a href="/report">📈 报表统计</a>
<a href="/user">👥 用户管理</a>
</nav>
<div class="logout"><a href="#" onclick="logout()">🚪 退出登录</a></div>
</aside>
<div class="main">
<div class="card">
<h2>patient 管理</h2>
<div class="placeholder">🛠 功能开发中，敬请期待...</div>
</div>
</div>
<script>
function logout() {
  fetch('/api/logout', {method:'POST'}).then(function(){ window.location.href='/login'; }).catch(function(){ window.location.href='/login'; });
}
</script>
</body>
</html>
