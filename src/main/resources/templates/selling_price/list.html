<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>售价管理</title>
<link rel="stylesheet" href="/css/session-ui.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f0f2f5;display:flex;min-height:100vh}
.sidebar{width:220px;background:#001529;color:#fff;position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column}
.sidebar .logo{padding:20px;font-size:18px;font-weight:600;border-bottom:1px solid rgba(255,255,255,0.1);text-align:center}.sidebar .logo span{color:#1890ff}
.sidebar nav{flex:1;padding:12px 0}.sidebar nav a{display:block;padding:14px 24px;color:rgba(255,255,255,0.65);text-decoration:none;font-size:14px;transition:all 0.2s}
.sidebar nav a:hover,.sidebar nav a.active{color:#fff;background:rgba(255,255,255,0.08)}
.main{margin-left:220px;flex:1;padding:24px}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.page-header h2{font-size:20px;color:#333}
.btn{padding:8px 20px;border-radius:6px;border:none;cursor:pointer;font-size:14px;transition:opacity 0.2s}.btn:hover{opacity:0.85}
.btn-primary{background:#1890ff;color:#fff}.btn-danger{background:#ff4d4f;color:#fff}.btn-sm{padding:4px 12px;font-size:12px}.btn-success{background:#52c41a;color:#fff}
.search-bar{background:#fff;padding:16px;border-radius:8px;margin-bottom:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;box-shadow:0 1px 4px rgba(0,0,0,0.05)}
.search-bar label{font-size:13px;color:#666;margin-bottom:4px;display:block}
.search-bar input{padding:8px 12px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;width:160px}
.search-bar input:focus{outline:none;border-color:#1890ff;box-shadow:0 0 0 2px rgba(24,144,255,0.1)}
.table-card{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,0.05);overflow:hidden}
table{width:100%;border-collapse:collapse}thead{background:#fafafa}
th{padding:12px 16px;text-align:left;font-weight:600;font-size:13px;color:#666;border-bottom:1px solid #f0f0f0}
td{padding:12px 16px;font-size:13px;color:#333;border-bottom:1px solid #f0f0f0}tr:hover td{background:#f5f7fa}
.action-btns{display:flex;gap:6px}.empty-row td{text-align:center;color:#999;padding:40px}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.45);z-index:1000;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}.modal{background:#fff;border-radius:8px;width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 4px 24px rgba(0,0,0,0.15)}
.modal-header{padding:16px 24px;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center}.modal-header h3{font-size:16px;color:#333}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:#999}
.modal-body{padding:24px}.form-group{margin-bottom:14px}.form-group label{display:block;font-size:13px;color:#666;margin-bottom:5px}
.form-group input,.form-group select{width:100%;padding:8px 12px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;box-sizing:border-box}
.form-group input:focus,.form-group select:focus{outline:none;border-color:#1890ff}
.form-row{display:flex;gap:12px}.form-row .form-group{flex:1}
.modal-footer{padding:12px 24px;border-top:1px solid #f0f0f0;display:flex;justify-content:flex-end;gap:8px}
.modal-footer .btn-cancel{background:#fff;border:1px solid #d9d9d9;padding:8px 20px;border-radius:6px;cursor:pointer;font-size:14px}
.search-list{max-height:160px;overflow-y:auto;border:1px solid #d9d9d9;border-radius:6px;display:none;margin-bottom:8px}
.search-list .item{padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid #f0f0f0}
.search-list .item:hover{background:#e6f7ff}
.toast{position:fixed;top:20px;right:20px;padding:12px 24px;border-radius:6px;color:#fff;font-size:14px;z-index:2000;display:none;animation:slideIn 0.3s}
.toast.success{background:#52c41a}.toast.error{background:#ff4d4f}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
</style></head>
<body>
<aside class="sidebar"><div class="logo">诊所<span>管理</span></div><nav>
<a href="/dashboard">📊 仪表盘</a><a href="/patients">👤 患者管理</a><a href="/physic">💊 药品/耗材</a>
<a href="/purchase">📦 进货管理</a><a href="/prescription">📋 处方管理</a><a href="/inventory">🏪 库存查询</a>
<a href="/selling-price" class="active">💰 售价管理</a><a href="/report">📈 报表统计</a><a href="/user">👥 用户管理</a>
</nav>
<div class="session-user-box">
<span class="session-user-name">当前用户：<span data-current-user-name>加载中...</span></span>
<span class="session-user-role" data-current-user-role></span>
<a href="#" class="session-logout" data-logout>退出登录</a>
</div>
</aside>

<div class="main">
<div class="page-header"><h2>💰 售价管理</h2><button class="btn btn-primary" onclick="openAdd()">+ 新增售价</button></div>
<div class="search-bar">
<div><label>药品名称</label><input id="sName" placeholder="输入名称搜索" oninput="loadList()"></div>
<div><label>类型</label><select id="sType" onchange="loadList()"><option value="0">全部</option><option value="10">药品</option><option value="20">耗材</option></select></div>
<div style="display:flex;gap:8px;align-items:flex-end"><button class="btn btn-primary" onclick="loadList()">🔍 搜索</button><button class="btn" style="background:#fff;border:1px solid #d9d9d9" onclick="resetSearch()">↺ 重置</button></div>
</div>
<div class="table-card"><table>
<thead><tr><th>药品</th><th>售价</th><th>状态</th><th>操作</th></tr></thead>
<tbody id="dataTable"><tr class="empty-row"><td colspan="4">加载中...</td></tr></tbody>
</table></div></div>

<div class="modal-overlay" id="formModal"><div class="modal">
<div class="modal-header"><h3 id="modalTitle">新增售价</h3><button class="modal-close" onclick="closeModal()">×</button></div>
<div class="modal-body">
<input type="hidden" id="editId">
<div class="form-group"><label>选择药品</label><input id="drugSearch" placeholder="搜索药品名称" oninput="searchDrugs()"><div class="search-list" id="drugSearchList"></div><div id="selDrugDisplay" style="font-size:13px;color:#1890ff;display:none"></div><input type="hidden" id="selDrugId"></div>
<div class="form-group"><label>售价（元）*</label><input id="fPrice" type="number" step="0.01" placeholder="请输入售价"></div>
<div class="form-group" id="statusGroup" style="display:none"><label>状态</label><select id="fStatus"><option value="1">正常</option><option value="0">待设置</option><option value="-1">停用</option></select></div>
</div>
<div class="modal-footer"><button class="btn-cancel" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="save()">保存</button></div></div></div>

<div class="toast" id="toast"></div>
<script>
var priceData=[],drugMap={},allDrugs=[];
function statusText(s){return s===1?"正常":s===0?"待设置":s===-1?"停用":s===2?"占用":"未知";}function statusColor(s){return s===1?"#52c41a":s===0?"#faad14":s===-1?"#ff4d4f":s===2?"#1890ff":"#999";}
function sToast(m,t){var e=document.getElementById('toast');e.textContent=m;e.className='toast '+t;e.style.display='block';setTimeout(function(){e.style.display='none'},2500);}
function h(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function resetSearch(){document.getElementById('sName').value='';document.getElementById('sType').value='0';loadList();}

function loadList(){
  var q=document.getElementById('sName').value.trim();
  var type=parseInt(document.getElementById('sType').value);
  document.getElementById('dataTable').innerHTML='<tr class="empty-row"><td colspan="4">加载中...</td></tr>';
  // 先加载药品列表，再加载售价列表
  fetch('/physic/list?name=').then(r=>r.json()).then(function(d){
    allDrugs=d||[];drugMap={};
    allDrugs.forEach(function(p){drugMap[p.id]=p;});
    return fetch('/sp/list');
  }).then(function(r){return r.json();}).then(function(d){
    priceData=d||[];
    var list=priceData;
    if(q||type>0){
      list=priceData.filter(function(item){
        var drug=drugMap[item.physic];
        if(!drug)return false;
        if(q&&drug.name.indexOf(q)===-1&&(!drug.alias||drug.alias.indexOf(q)===-1))return false;
        if(type>0&&drug.type!==type)return false;
        return true;
      });
    }
    var t=document.getElementById('dataTable');
    if(!list.length){t.innerHTML='<tr class="empty-row"><td colspan="4">暂无数据</td></tr>';return;}
    t.innerHTML=list.map(function(item){
      var drug=drugMap[item.physic];
      var dn=drug?drug.name:'未知';
      var st=statusText(item.status);var sc=statusColor(item.status);
      return '<tr><td>'+h(dn)+'</td><td>'+item.price+'</td><td style="color:'+sc+'">'+st+'</td><td class="action-btns"><button class="btn btn-sm btn-primary" onclick="openEdit('+item.id+')">编辑</button><button class="btn btn-sm btn-danger" onclick="delPrice('+item.id+')">删除</button></td></tr>';
    }).join('');
  }).catch(function(){document.getElementById('dataTable').innerHTML='<tr class="empty-row"><td colspan="4">加载失败</td></tr>';});
}

function searchDrugs(){
  var q=document.getElementById('drugSearch').value.trim();
  var list=document.getElementById('drugSearchList');
  if(!q){list.style.display='none';return;}
  fetch('/physic/list?name='+encodeURIComponent(q)).then(r=>r.json()).then(function(d){
    var html='';
    if(!d||!d.length){html='<div class="item" style="color:#999;cursor:default">未找到</div>';}
    else{d.forEach(function(p){html+='<div class="item" onclick="selectDrug('+p.id+',\''+h(p.name)+'\')">'+h(p.name)+(p.alias?' ('+h(p.alias)+')':'')+'</div>';});}
    list.innerHTML=html;list.style.display='block';
  }).catch(function(){});
}
function selectDrug(id,name){
  document.getElementById('selDrugId').value=id;
  document.getElementById('drugSearch').value=name;
  document.getElementById('selDrugDisplay').textContent='已选: '+name;document.getElementById('selDrugDisplay').style.display='block';
  document.getElementById('drugSearchList').style.display='none';
}

function openAdd(){
  document.getElementById('modalTitle').textContent='新增售价';
  document.getElementById('editId').value='';
  document.getElementById('drugSearch').value='';
  document.getElementById('selDrugId').value='';
  document.getElementById('selDrugDisplay').style.display='none';
  document.getElementById('fPrice').value='';
  document.getElementById('statusGroup').style.display='none';
  document.getElementById('formModal').classList.add('show');
}
function openEdit(id){
  var item=priceData.find(function(x){return x.id==id;});
  if(!item){sToast('获取信息失败','error');return;}
  var drug=drugMap[item.physic];
  document.getElementById('modalTitle').textContent='编辑售价';
  document.getElementById('editId').value=item.id;
  document.getElementById('drugSearch').value=drug?drug.name:'';
  document.getElementById('selDrugId').value=item.physic;
  document.getElementById('selDrugDisplay').textContent='已选: '+(drug?drug.name:'');
  document.getElementById('selDrugDisplay').style.display='block';
  document.getElementById('fPrice').value=item.price;
  document.getElementById('statusGroup').style.display='block';
  document.getElementById('fStatus').value=item.status!=null?String(item.status):'1';
  document.getElementById('formModal').classList.add('show');
}
function closeModal(){document.getElementById('formModal').classList.remove('show');}

function save(){
  var id=document.getElementById('editId').value;
  var pid=document.getElementById('selDrugId').value;
  var price=parseFloat(document.getElementById('fPrice').value);
  if(!pid){sToast('请选择药品','error');return;}
  if(!price||price<=0){sToast('请输入有效售价','error');return;}
  var body={physic:parseInt(pid),price:price};
  var url='/sp/add';
  if(id){body.id=parseInt(id);body.status=parseInt(document.getElementById('fStatus').value);url='/sp/upd';}
  fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
  .then(function(r){return r.json();}).then(function(r){sToast(id?'更新成功':'添加成功','success');closeModal();loadList();})
  .catch(function(){sToast('操作失败','error');});
}

function delPrice(id){
  if(!confirm('确定删除该售价？'))return;
  fetch('/sp/del?id='+id,{method:'POST'}).then(function(r){return r.json();}).then(function(){sToast('删除成功','success');loadList();}).catch(function(){sToast('删除失败','error');});
}

loadList();
</script>
<script src="/js/session-ui.js"></script>
</body></html>
