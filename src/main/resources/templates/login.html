<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>诊所管理系统 - 登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            width: 380px;
        }
        .login-container h1 {
            text-align: center;
            color: #333;
            font-size: 24px;
            margin-bottom: 8px;
        }
        .login-container p.sub {
            text-align: center;
            color: #999;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .login-btn:hover { opacity: 0.9; }
        .error-msg {
            color: #e74c3c;
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
            display: none;
        }
        .error-msg.show { display: block; }
        .error-msg.warning { color: #fa8c16; }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>诊所管理系统</h1>
        <p class="sub">请使用您的账号登录</p>
        <div class="form-group">
            <label for="tenantCode">诊所编码</label>
            <input type="text" id="tenantCode" value="default" placeholder="请输入诊所编码" autofocus>
        </div>
        <div class="form-group">
            <label for="phone">手机号</label>
            <input type="text" id="phone" placeholder="请输入手机号">
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" placeholder="请输入密码">
        </div>
        <button class="login-btn" onclick="doLogin()">登 录</button>
        <div class="error-msg" id="errorMsg"></div>
    </div>
    <script>
        function doLogin() {
            var tenantCode = document.getElementById('tenantCode').value.trim();
            var phone = document.getElementById('phone').value.trim();
            var password = document.getElementById('password').value.trim();
            var errorEl = document.getElementById('errorMsg');

            if (!tenantCode || !phone || !password) {
                errorEl.textContent = '请输入诊所编码、手机号和密码';
                errorEl.classList.add('show');
                return;
            }

            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/login', true);
            xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
            xhr.onload = function() {
                var resp = JSON.parse(xhr.responseText);
                if (resp.code === 200) {
                    var warning = resp.data && resp.data.warningMessage;
                    if (warning) {
                        errorEl.textContent = warning;
                        errorEl.className = 'error-msg warning show';
                        setTimeout(function(){ window.location.href = '/dashboard'; }, 3500);
                    } else {
                        window.location.href = '/dashboard';
                    }
                } else {
                    errorEl.textContent = resp.msg || '登录失败';
                    errorEl.className = 'error-msg show';
                }
            };
            xhr.onerror = function() {
                errorEl.textContent = '网络错误，请重试';
                errorEl.classList.add('show');
            };
            xhr.send('tenantCode=' + encodeURIComponent(tenantCode)
                    + '&phone=' + encodeURIComponent(phone)
                    + '&password=' + encodeURIComponent(password));
        }
        document.getElementById('password').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') doLogin();
        });
        var licenseMessage = new URLSearchParams(window.location.search).get('licenseMessage');
        if (licenseMessage) {
            var licenseErrorEl = document.getElementById('errorMsg');
            licenseErrorEl.textContent = licenseMessage;
            licenseErrorEl.className = 'error-msg warning show';
        }
    </script>
</body>
</html>
