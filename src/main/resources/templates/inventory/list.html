<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>库存管理</title>
<link rel="stylesheet" href="/css/session-ui.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f0f2f5;display:flex;min-height:100vh}
.sidebar{width:220px;background:#001529;color:#fff;position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column}
.sidebar .logo{padding:20px;font-size:18px;font-weight:600;border-bottom:1px solid rgba(255,255,255,0.1);text-align:center}.sidebar .logo span{color:#1890ff}
.sidebar nav{flex:1;padding:12px 0}.sidebar nav a{display:block;padding:14px 24px;color:rgba(255,255,255,0.65);text-decoration:none;font-size:14px;transition:all 0.2s}
.sidebar nav a:hover,.sidebar nav a.active{color:#fff;background:rgba(255,255,255,0.08)}
.main{margin-left:220px;flex:1;padding:24px}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.page-header h2{font-size:20px;color:#333}
.btn{padding:8px 20px;border-radius:6px;border:none;cursor:pointer;font-size:14px;transition:opacity 0.2s}.btn:hover{opacity:0.85}
.btn-primary{background:#1890ff;color:#fff}.btn-sm{padding:4px 12px;font-size:12px}
.search-bar{background:#fff;padding:16px;border-radius:8px;margin-bottom:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;box-shadow:0 1px 4px rgba(0,0,0,0.05)}
.search-bar label{font-size:13px;color:#666;margin-bottom:4px;display:block}
.search-bar input,.search-bar select{padding:8px 12px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;width:160px}
.search-bar input:focus,.search-bar select:focus{outline:none;border-color:#1890ff;box-shadow:0 0 0 2px rgba(24,144,255,0.1)}
.table-card{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,0.05);overflow:hidden}
table{width:100%;border-collapse:collapse}thead{background:#fafafa}
th{padding:12px 16px;text-align:left;font-weight:600;font-size:13px;color:#666;border-bottom:1px solid #f0f0f0}
td{padding:12px 16px;font-size:13px;color:#333;border-bottom:1px solid #f0f0f0}tr:hover td{background:#f5f7fa}
.action-btns{display:flex;gap:6px}.empty-row td{text-align:center;color:#999;padding:40px}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.45);z-index:1000;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}.modal{background:#fff;border-radius:8px;width:740px;max-height:90vh;overflow-y:auto;box-shadow:0 4px 24px rgba(0,0,0,0.15)}
.modal-header{padding:16px 24px;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center}.modal-header h3{font-size:16px;color:#333}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:#999}
.modal-body{padding:24px}.form-group{margin-bottom:16px}.form-group label{display:block;font-size:13px;color:#666;margin-bottom:6px}
.modal-footer{padding:12px 24px;border-top:1px solid #f0f0f0;display:flex;justify-content:flex-end;gap:8px}
.modal-footer .btn-cancel{background:#fff;border:1px solid #d9d9d9;padding:8px 20px;border-radius:6px;cursor:pointer;font-size:14px}
.toast{position:fixed;top:20px;right:20px;padding:12px 24px;border-radius:6px;color:#fff;font-size:14px;z-index:2000;display:none;animation:slideIn 0.3s}
.toast.success{background:#52c41a}.toast.error{background:#ff4d4f}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.low-stock{color:#faad14;font-weight:600}.out-stock{color:#ff4d4f;font-weight:600}.in-stock{color:#52c41a}
</style></head>
<body>
<aside class="sidebar"><div class="logo">诊所<span>管理</span></div><nav>
<a href="/dashboard">📊 仪表盘</a><a href="/patients">👤 患者管理</a><a href="/physic">💊 药品/耗材</a>
<a href="/purchase">📦 进货管理</a><a href="/prescription">📋 处方管理</a>
<a href="/inventory" class="active">🏪 库存查询</a><a href="/selling-price">💰 售价管理</a><a href="/report">📈 报表统计</a><a href="/user">👥 用户管理</a>
<a href="/audit" th:if="${session.currentUser != null and session.currentUser.auditViewer}">🧾 审计日志</a>
</nav>
<div class="session-user-box">
<span class="session-user-name">当前用户：<span data-current-user-name>加载中...</span></span>
<span class="session-user-role" data-current-user-role></span>
<a href="#" class="session-logout" data-logout>退出登录</a>
</div>
</aside>

<div class="main">
<div class="page-header"><h2>🏪 库存查询</h2></div>
<div class="search-bar">
<div><label>名称</label><input id="sName" placeholder="输入名称搜索"></div>
<div><label>类型</label><select id="sType"><option value="0">全部</option><option value="10">药品</option><option value="20">耗材</option></select></div>
<div style="display:flex;gap:8px;align-items:flex-end">
<button class="btn btn-primary" onclick="loadList()">🔍 搜索</button>
<button class="btn" style="background:#fff;border:1px solid #d9d9d9" onclick="resetSearch()">↺ 重置</button>
</div>
</div>

<div class="table-card"><table>
<thead><tr><th>名称</th><th>类型</th><th>厂商</th><th>单位</th><th>可用库存</th><th>已占用</th><th>均价(元)</th><th>操作</th></tr></thead>
<tbody id="dataTable"><tr class="empty-row"><td colspan="8">加载中...</td></tr></tbody>
</table></div></div>

<div class="modal-overlay" id="detailModal"><div class="modal">
<div class="modal-header"><h3 id="detailTitle">库存明细</h3><button class="modal-close" onclick="closeDetail()">×</button></div>
<div class="modal-body" id="detailBody"></div>
<div class="modal-footer"><button class="btn-cancel" onclick="closeDetail()">关闭</button></div></div></div>

<div class="toast" id="toast"></div>
<script>
var stockData=[];
function statusText(s){return s===1?"正常":s===0?"待设置":s===-1?"停用":s===2?"占用":"未知";}function statusColor(s){return s===1?"#52c41a":s===0?"#faad14":s===-1?"#ff4d4f":s===2?"#1890ff":"#999";}
function sToast(m,t){var e=document.getElementById('toast');e.textContent=m;e.className='toast '+t;e.style.display='block';setTimeout(function(){e.style.display='none'},2500);}
function h(s){if(!s)return'';return String(s).split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;');}
function resetSearch(){document.getElementById('sName').value='';document.getElementById('sType').value='0';loadList();}

function loadList(){
  var q=document.getElementById('sName').value.trim();
  var type=parseInt(document.getElementById('sType').value);
  var unitMap={0:'-',1:'个',2:'瓶',3:'盒',4:'袋',11:'毫克',12:'克',13:'千克',21:'毫升',22:'升'};
  document.getElementById('dataTable').innerHTML='<tr class="empty-row"><td colspan="8">加载中...</td></tr>';
  fetch('/inventory/summary').then(r=>r.json()).then(function(d){
    stockData=d||[];
    var filtered=stockData.filter(function(item){
      if(type>0&&item.type!==type)return false;
      if(q&&item.physicName&&item.physicName.indexOf(q)===-1&&(!item.physicAlias||item.physicAlias.indexOf(q)===-1))return false;
      return true;
    });
    var t=document.getElementById('dataTable');
    if(!filtered||filtered.length===0){t.innerHTML='<tr class="empty-row"><td colspan="8">暂无数据</td></tr>';return;}
    t.innerHTML=filtered.map(function(item){
      var typeText=item.type===10?'药品':'耗材';
      var unitText=unitMap[item.unit]||'-';
      var qtyClass=item.availableQty<=0?'out-stock':item.availableQty<10?'low-stock':'in-stock';
      return '<tr><td>'+h(item.physicName)+'</td><td>'+typeText+'</td><td>'+h(item.manufacturer)+'</td><td>'+unitText+'</td><td class="'+qtyClass+'">'+item.availableQty+'</td><td>'+item.occupiedQty+'</td><td>￥'+Number(item.avgBuyingPrice||0).toFixed(2)+'</td><td class="action-btns"><button class="btn btn-sm btn-primary" onclick="showDetail('+item.physicId+')">明细</button></td></tr>';
    }).join('');
  }).catch(function(){document.getElementById('dataTable').innerHTML='<tr class="empty-row"><td colspan="8">加载失败</td></tr>';});
}

function showDetail(pid){
  var item=stockData.find(function(x){return x.physicId==pid;});
  if(!item){sToast('未找到药品信息','error');return;}
  var pn=String(item.physicName||'');
  var pa=item.physicAlias?' ('+String(item.physicAlias)+')':'';
  var av=item.availableQty,oc=item.occupiedQty;
  document.getElementById('detailTitle').textContent='库存明细 - '+pn;
  document.getElementById('detailBody').innerHTML='<div class="form-group"><label>药品名称</label><div>'+pn+pa+'</div></div><div class="form-group"><label>可用库存</label><div style="color:#52c41a;font-weight:600">'+av+'</div></div><div class="form-group"><label>已占用</label><div style="color:#1890ff">'+oc+'</div></div><div class="form-group"><label>进货明细</label></div><div id="detailTable"><p style="text-align:center;color:#999;padding:20px">加载中...</p></div>';
  document.getElementById('detailModal').classList.add('show');
  fetch('/inventory/detail?physicId='+pid).then(function(r){return r.json();}).then(function(d){
    var list=d||[];
    var dt=document.getElementById('detailTable');
    if(!list.length){dt.innerHTML='<p style="text-align:center;color:#999;padding:20px">暂无进货记录</p>';return;}
    var h='<table style="width:100%;border-collapse:collapse"><thead style="background:#fafafa"><tr><th style="padding:8px 10px;text-align:left;font-size:12px;color:#666;border-bottom:1px solid #f0f0f0">批次</th><th style="padding:8px 10px;text-align:left;font-size:12px;color:#666;border-bottom:1px solid #f0f0f0">进货价格</th><th style="padding:8px 10px;text-align:left;font-size:12px;color:#666;border-bottom:1px solid #f0f0f0">进货数量</th><th style="padding:8px 10px;text-align:left;font-size:12px;color:#666;border-bottom:1px solid #f0f0f0">占用数量</th><th style="padding:8px 10px;text-align:left;font-size:12px;color:#666;border-bottom:1px solid #f0f0f0">剩余数量</th><th style="padding:8px 10px;text-align:left;font-size:12px;color:#666;border-bottom:1px solid #f0f0f0">时间</th></tr></thead><tbody>';
    list.forEach(function(r){
      h+='<tr><td style="padding:8px 10px;font-size:12px;color:#333;border-bottom:1px solid #f0f0f0">'+r.batch+'</td><td style="padding:8px 10px;font-size:12px;color:#333;border-bottom:1px solid #f0f0f0">￥'+Number(r.buyingPrice||0).toFixed(2)+'</td><td style="padding:8px 10px;font-size:12px;color:#333;border-bottom:1px solid #f0f0f0">'+r.totalQty+'</td><td style="padding:8px 10px;font-size:12px;color:#333;border-bottom:1px solid #f0f0f0">'+r.occupiedQty+'</td><td style="padding:8px 10px;font-size:12px;color:#333;border-bottom:1px solid #f0f0f0">'+r.remainingQty+'</td><td style="padding:8px 10px;font-size:12px;color:#333;border-bottom:1px solid #f0f0f0">'+(r.createTime?r.createTime.substring(0,19):'-')+'</td></tr>';
    });
    h+='</tbody></table>';dt.innerHTML=h;
  }).catch(function(){document.getElementById('detailTable').innerHTML='<p style="text-align:center;color:#999;padding:20px">加载失败</p>';});
}
function closeDetail(){document.getElementById('detailModal').classList.remove('show');}

loadList();
</script>
<script src="/js/session-ui.js"></script>
</body></html>
