<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>药品/耗材管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f0f2f5;display:flex;min-height:100vh}
.sidebar{width:220px;background:#001529;color:#fff;position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column}
.sidebar .logo{padding:20px;font-size:18px;font-weight:600;border-bottom:1px solid rgba(255,255,255,0.1);text-align:center}.sidebar .logo span{color:#1890ff}
.sidebar nav{flex:1;padding:12px 0}
.sidebar nav a{display:block;padding:14px 24px;color:rgba(255,255,255,0.65);text-decoration:none;font-size:14px;transition:all 0.2s}
.sidebar nav a:hover,.sidebar nav a.active{color:#fff;background:rgba(255,255,255,0.08)}
.main{margin-left:220px;flex:1;padding:24px}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.page-header h2{font-size:20px;color:#333}
.btn{padding:8px 20px;border-radius:6px;border:none;cursor:pointer;font-size:14px;transition:opacity 0.2s}
.btn:hover{opacity:0.85}.btn-primary{background:#1890ff;color:#fff}.btn-danger{background:#ff4d4f;color:#fff}.btn-sm{padding:4px 12px;font-size:12px}.btn-edit{background:#52c41a;color:#fff}
.search-bar{background:#fff;padding:16px;border-radius:8px;margin-bottom:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;box-shadow:0 1px 4px rgba(0,0,0,0.05)}
.search-bar input,.search-bar select{padding:8px 12px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px}.search-bar input:focus,.search-bar select:focus{outline:none;border-color:#1890ff}
.table-card{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,0.05);overflow:hidden}
table{width:100%;border-collapse:collapse}thead{background:#fafafa}th{padding:12px 16px;text-align:left;font-weight:600;font-size:13px;color:#666;border-bottom:1px solid #f0f0f0}
td{padding:12px 16px;font-size:13px;color:#333;border-bottom:1px solid #f0f0f0}tr:hover td{background:#f5f7fa}
.action-btns{display:flex;gap:6px}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.45);z-index:1000;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}.modal{background:#fff;border-radius:8px;width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 4px 24px rgba(0,0,0,0.15)}
.modal-header{padding:16px 24px;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center}.modal-header h3{font-size:16px}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:#999}
.modal-body{padding:24px}.form-group{margin-bottom:16px}.form-group label{display:block;font-size:13px;color:#666;margin-bottom:6px}
.form-group input,.form-group select{width:100%;padding:8px 12px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px}
.form-group input:focus,.form-group select:focus{outline:none;border-color:#1890ff}
.form-row{display:flex;gap:12px}.form-row .form-group{flex:1}
.modal-footer{padding:12px 24px;border-top:1px solid #f0f0f0;display:flex;justify-content:flex-end;gap:8px}
.modal-footer .btn-cancel{background:#fff;border:1px solid #d9d9d9;padding:8px 20px;border-radius:6px;cursor:pointer;font-size:14px}
.toast{position:fixed;top:20px;right:20px;padding:12px 24px;border-radius:6px;color:#fff;font-size:14px;z-index:2000;display:none;animation:slideIn 0.3s}
.toast.success{background:#52c41a}.toast.error{background:#ff4d4f}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.empty-row td{text-align:center;color:#999;padding:40px}
</style></head>
<body>
<aside class="sidebar">
<div class="logo">诊所<span>管理</span></div><nav>
<a href="/dashboard">📊 仪表盘</a><a href="/patients">👤 患者管理</a>
<a href="/physic" class="active">💊 药品/耗材</a><a href="/purchase">📦 进货管理</a>
<a href="/prescription">📋 处方管理</a><a href="/inventory">🏪 库存查询</a>
<a href="/selling-price">💰 售价管理</a>
<a href="/report">📈 报表统计</a><a href="/user">👥 用户管理</a>
</nav></aside>
<div class="main">
<div class="page-header"><h2>💊 药品/耗材管理</h2><button class="btn btn-primary" onclick="openAddModal()">+ 新增</button></div>
<div class="search-bar">
<input id="sName" placeholder="名称搜索"><select id="sType"><option value="0">全部类型</option><option value="10">药品</option><option value="20">耗材</option></select>
<button class="btn btn-primary" onclick="loadList()">🔍 搜索</button>
</div>
<div class="table-card"><table>
<thead><tr><th>ID</th><th>名称</th><th>类型</th><th>别名</th><th>厂商</th><th>单位</th><th>状态</th><th>操作</th></tr></thead>
<tbody id="dataTable"><tr class="empty-row"><td colspan="8">加载中...</td></tr></tbody>
</table></div></div>
<div class="modal-overlay" id="formModal"><div class="modal">
<div class="modal-header"><h3 id="modalTitle">新增</h3><button class="modal-close" onclick="closeModal()">×</button></div>
<div class="modal-body">
<input type="hidden" id="editId">
<div class="form-group"><label>名称 *</label><input id="fName" placeholder="请输入名称"></div>
<div class="form-row">
<div class="form-group"><label>类型</label><select id="fType"><option value="10">药品</option><option value="20">耗材</option></select></div>
<div class="form-group"><label>单位</label><select id="fUnit"><option value="0">未选择</option><option value="1">个</option><option value="2">瓶</option><option value="3">盒</option><option value="4">袋</option><option value="11">毫克</option><option value="12">克</option><option value="13">千克</option><option value="21">毫升</option><option value="22">升</option></select></div>
</div>
<div class="form-group"><label>别名</label><input id="fAlias" placeholder="请输入别名"></div>
<div class="form-group"><label>厂商</label><input id="fManufacturer" placeholder="请输入生产厂商"></div>
<div class="form-group"><label>状态</label>
<select id="fStatus" style="color:#52c41a;font-weight:500;background:#fff">
<option value="1" style="color:#52c41a">✓ 正常</option>
<option value="0" style="color:#faad14">待设置</option>
<option value="-1" style="color:#ff4d4f">✕ 停用</option>
</select>
</div>
</div>
<div class="modal-footer">
<button class="btn-cancel" onclick="closeModal()">取消</button>
<button class="btn btn-primary" onclick="save()">保存</button>
</div></div></div>
<div class="toast" id="toast"></div>
<script>
function statusText(s){return s===1?"正常":s===0?"待设置":s===-1?"停用":s===2?"占用":"未知";}function statusColor(s){return s===1?"#52c41a":s===0?"#faad14":s===-1?"#ff4d4f":s===2?"#1890ff":"#999";}
function showToast(m,t){var e=document.getElementById('toast');e.textContent=m;e.className='toast '+t;e.style.display='block';setTimeout(function(){e.style.display='none'},2500);}
function loadList(){
  var n=document.getElementById('sName').value;
  document.getElementById('dataTable').innerHTML='<tr class="empty-row"><td colspan="8">加载中...</td></tr>';
  fetch('/physic/list?name='+encodeURIComponent(n)).then(function(r){return r.json();}).then(function(d){
    var t=document.getElementById('dataTable');
    if(!d||d.length===0){t.innerHTML='<tr class="empty-row"><td colspan="8">暂无数据</td></tr>';return;}
    t.innerHTML=d.map(function(p){
      var typeText=p.type===10?'药品':'耗材';
      var unitMap={0:'-',1:'个',2:'瓶',3:'盒',4:'袋',11:'毫克',12:'克',13:'千克',21:'毫升',22:'升'};
      var unitText=unitMap[p.unit]||'-';
      var stxt=statusText(p.status);
      var sc=statusColor(p.status);
      return '<tr><td>'+p.id+'</td><td>'+h(p.name)+'</td><td>'+typeText+'</td><td>'+h(p.alias)+'</td><td>'+h(p.manufacturer)+'</td><td>'+unitText+'</td><td style="color:'+sc+'">'+stxt+'</td><td class="action-btns"><button class="btn btn-sm btn-edit" onclick="openEdit('+p.id+')">编辑</button><button class="btn btn-sm btn-danger" onclick="del('+p.id+')">删除</button></td></tr>';
    }).join('');
  }).catch(function(){document.getElementById('dataTable').innerHTML='<tr class="empty-row"><td colspan="8">加载失败</td></tr>';});
}
function h(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function openAddModal(){document.getElementById('modalTitle').textContent='新增药品/耗材';document.getElementById('editId').value='';document.getElementById('fName').value='';document.getElementById('fType').value='10';document.getElementById('fUnit').value='1';document.getElementById('fAlias').value='';document.getElementById('fManufacturer').value='';
  document.getElementById('fStatus').value='1';document.getElementById('formModal').classList.add('show');}
function openEdit(id){fetch('/physic/getById?id='+id).then(function(r){return r.json();}).then(function(p){
  document.getElementById('modalTitle').textContent='编辑药品/耗材';document.getElementById('editId').value=p.id;
  document.getElementById('fName').value=p.name;document.getElementById('fType').value=p.type;
  document.getElementById('fUnit').value=p.unit;document.getElementById('fAlias').value=p.alias||'';
  document.getElementById('fManufacturer').value=p.manufacturer||'';
  document.getElementById('fStatus').value=p.status!=null?String(p.status):'1';
  document.getElementById('formModal').classList.add('show');
}).catch(function(){showToast('获取信息失败','error');});}
function closeModal(){document.getElementById('formModal').classList.remove('show');}
function save(){
  var id=document.getElementById('editId').value;
  var name=document.getElementById('fName').value.trim();
  if(!name){showToast('请输入名称','error');return;}
  var body={name:name,type:parseInt(document.getElementById('fType').value),unit:parseInt(document.getElementById('fUnit').value),
    alias:document.getElementById('fAlias').value.trim(),manufacturer:document.getElementById('fManufacturer').value.trim(),status:parseInt(document.getElementById('fStatus').value)};
  if(id){body.id=parseInt(id);}
  fetch(id?'/physic/upd':'/physic/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.json();}).then(function(resp){
      showToast(id?'更新成功':'添加成功','success');closeModal();loadList();
    }).catch(function(){showToast('操作失败','error');});
}
function del(id){if(!confirm('确定删除？'))return;
  fetch('/physic/del?id='+id,{method:'POST'}).then(function(r){return r.json();}).then(function(r){showToast('删除成功','success');loadList();}).catch(function(){showToast('删除失败','error');});
}
loadList();
</script></body></html>
