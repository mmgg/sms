<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>用户管理</title>
<link rel="stylesheet" href="/css/session-ui.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f0f2f5;display:flex;min-height:100vh}
.sidebar{width:220px;background:#001529;color:#fff;position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column}
.sidebar .logo{padding:20px;font-size:18px;font-weight:600;border-bottom:1px solid rgba(255,255,255,0.1);text-align:center}.sidebar .logo span{color:#1890ff}
.sidebar nav{flex:1;padding:12px 0}.sidebar nav a{display:block;padding:14px 24px;color:rgba(255,255,255,0.65);text-decoration:none;font-size:14px;transition:all 0.2s}
.sidebar nav a:hover,.sidebar nav a.active{color:#fff;background:rgba(255,255,255,0.08)}
.sidebar .logout{padding:16px 20px;border-top:1px solid rgba(255,255,255,0.1)}.sidebar .logout a{color:rgba(255,255,255,0.45);text-decoration:none;font-size:13px}
.main{margin-left:220px;flex:1;padding:24px}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.page-header h2{font-size:20px;color:#333}
.btn{padding:8px 20px;border-radius:6px;border:none;cursor:pointer;font-size:14px;transition:opacity 0.2s}.btn:hover{opacity:0.85}
.btn-primary{background:#1890ff;color:#fff}.btn-danger{background:#ff4d4f;color:#fff}.btn-sm{padding:4px 12px;font-size:12px}.btn-edit{background:#52c41a;color:#fff}.btn-warn{background:#faad14;color:#fff}
.search-bar{background:#fff;padding:16px;border-radius:8px;margin-bottom:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;box-shadow:0 1px 4px rgba(0,0,0,0.05)}
.search-bar label{font-size:13px;color:#666;margin-bottom:4px;display:block}
.search-bar input,.search-bar select{padding:8px 12px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;width:160px}
.search-bar input:focus,.search-bar select:focus{outline:none;border-color:#1890ff;box-shadow:0 0 0 2px rgba(24,144,255,0.1)}
.table-card{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,0.05);overflow:hidden}
table{width:100%;border-collapse:collapse}thead{background:#fafafa}
th{padding:12px 16px;text-align:left;font-weight:600;font-size:13px;color:#666;border-bottom:1px solid #f0f0f0}
td{padding:12px 16px;font-size:13px;color:#333;border-bottom:1px solid #f0f0f0}tr:hover td{background:#f5f7fa}
.action-btns{display:flex;gap:6px}.empty-row td{text-align:center;color:#999;padding:40px}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.45);z-index:1000;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}.modal{background:#fff;border-radius:8px;width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 4px 24px rgba(0,0,0,0.15)}
.modal-header{padding:16px 24px;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center}.modal-header h3{font-size:16px;color:#333}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:#999}
.modal-body{padding:24px}.form-group{margin-bottom:16px}.form-group label{display:block;font-size:13px;color:#666;margin-bottom:6px}
.form-group input,.form-group select{width:100%;padding:8px 12px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px}
.form-group input:focus,.form-group select:focus{outline:none;border-color:#1890ff}
.form-row{display:flex;gap:12px}.form-row .form-group{flex:1}
.modal-footer{padding:12px 24px;border-top:1px solid #f0f0f0;display:flex;justify-content:flex-end;gap:8px}
.modal-footer .btn-cancel{background:#fff;border:1px solid #d9d9d9;padding:8px 20px;border-radius:6px;cursor:pointer;font-size:14px}
.toast{position:fixed;top:20px;right:20px;padding:12px 24px;border-radius:6px;color:#fff;font-size:14px;z-index:2000;display:none;animation:slideIn 0.3s}
.toast.success{background:#52c41a}.toast.error{background:#ff4d4f}
.permission-notice{background:#fff;border:1px solid #ffe58f;border-left:4px solid #faad14;border-radius:8px;padding:18px 20px;color:#8c6d1f;font-size:14px;line-height:1.7}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
</style></head>
<body>
<aside class="sidebar"><div class="logo">诊所<span>管理</span></div><nav>
<a href="/dashboard">📊 仪表盘</a><a href="/patients">👤 患者管理</a><a href="/physic">💊 药品/耗材</a>
<a href="/purchase">📦 进货管理</a><a href="/prescription">📋 处方管理</a><a href="/inventory">🏪 库存查询</a>
<a href="/selling-price">💰 售价管理</a><a href="/report">📈 报表统计</a><a href="/user" class="active">👥 用户管理</a>
</nav>
<div class="session-user-box">
<span class="session-user-name">当前用户：<span data-current-user-name>加载中...</span></span>
<span class="session-user-role" data-current-user-role></span>
<a href="#" class="session-logout" data-logout>退出登录</a>
</div>
</aside>

<div class="main">
<div id="permissionNotice" class="permission-notice" style="display:none">
  当前账号没有人员管理权限。人员新增、修改和密码重置请联系本诊所管理员。
</div>
<div id="userContent" style="display:none">
<div class="page-header"><h2>👥 用户管理</h2><button class="btn btn-primary" onclick="openAdd()">+ 新增用户</button></div>
<div class="search-bar">
<div><label>姓名</label><input id="sName" placeholder="输入姓名"></div>
<div><label>电话</label><input id="sPhone" placeholder="输入电话"></div>
<div style="display:flex;gap:8px;align-items:flex-end">
<button class="btn btn-primary" onclick="loadList()">🔍 搜索</button>
<button class="btn" style="background:#fff;border:1px solid #d9d9d9" onclick="resetSearch()">↺ 重置</button>
</div>
</div>
<div class="table-card"><table>
<thead><tr><th>ID</th><th>姓名</th><th>电话</th><th>岗位</th><th>权限</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead>
<tbody id="dataTable"><tr class="empty-row"><td colspan="8">加载中...</td></tr></tbody>
</table></div></div>
</div>

<div class="modal-overlay" id="formModal"><div class="modal">
<div class="modal-header"><h3 id="modalTitle">新增用户</h3><button class="modal-close" onclick="closeModal()">×</button></div>
<div class="modal-body">
<input type="hidden" id="editId">
<div class="form-group"><label>姓名 *</label><input id="fName" placeholder="请输入姓名"></div>
<div class="form-group"><label>手机号 *</label><input id="fPhone" placeholder="请输入手机号"></div>
<div class="form-row">
<div class="form-group"><label>角色</label>
<select id="fType"><option value="10">医生</option><option value="20">护士</option><option value="30">药师</option><option value="100">其他</option></select></div>
<div class="form-group"><label>状态</label>
<select id="fStatus"><option value="1">正常</option><option value="0">待设置</option><option value="-1">停用</option></select></div>
</div>
</div>
<div class="modal-footer"><button class="btn-cancel" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="save()">保存</button></div></div></div>

<div class="toast" id="toast"></div>
<script>
var typeMap={0:'未定义',10:'医生',20:'护士',30:'药师',100:'其他'};
var roleMap={1:'平台管理员',10:'诊所管理员',20:'普通员工'};
var ROLE_PLATFORM_ADMIN=1;
var ROLE_TENANT_ADMIN=10;
function ajaxFetch(url,opts){opts=opts||{};opts.credentials=opts.credentials||'same-origin';opts.headers=opts.headers||{};opts.headers['X-Requested-With']='XMLHttpRequest';return fetch(url,opts).then(function(r){if(r.status===401){window.location.href='/login';throw new Error('未登录');}return r;});}
function statusText(s){return s===1?'正常':s===0?'待设置':s===-1?'停用':s===2?'占用':'未知';}function statusColor(s){return s===1?'#52c41a':s===0?'#faad14':s===-1?'#ff4d4f':s===2?'#1890ff':'#999';}
function sToast(m,t){var e=document.getElementById('toast');e.textContent=m;e.className='toast '+t;e.style.display='block';setTimeout(function(){e.style.display='none'},2500);}
function h(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function logout(){fetch('/api/logout',{method:'POST'}).then(function(){window.location.href='/login';}).catch(function(){window.location.href='/login';});}

function initPage(){
  ajaxFetch('/api/user/current').then(function(r){return r.json();}).then(function(resp){
    var user=resp&&resp.data;
    var canManage=user&&(user.role===ROLE_PLATFORM_ADMIN||user.role===ROLE_TENANT_ADMIN);
    document.getElementById('userContent').style.display=canManage?'block':'none';
    document.getElementById('permissionNotice').style.display=canManage?'none':'block';
    if(canManage){loadList();}
  }).catch(function(){
    document.getElementById('userContent').style.display='none';
    document.getElementById('permissionNotice').style.display='block';
  });
}

function loadList(){
  var n=document.getElementById('sName').value.trim();
  var p=document.getElementById('sPhone').value.trim();
  document.getElementById('dataTable').innerHTML='<tr class="empty-row"><td colspan="8">加载中...</td></tr>';
  ajaxFetch('/user/list').then(function(r){return r.json();}).then(function(d){
    var t=document.getElementById('dataTable');
    if(!d||d.length===0){t.innerHTML='<tr class="empty-row"><td colspan="8">暂无数据</td></tr>';return;}
    var list=d;
    if(n) list=list.filter(function(u){return u.name&&u.name.indexOf(n)!==-1;});
    if(p) list=list.filter(function(u){return u.phone&&u.phone.indexOf(p)!==-1;});
    if(!list.length){t.innerHTML='<tr class="empty-row"><td colspan="8">暂无数据</td></tr>';return;}
    t.innerHTML=list.map(function(u){
      var tn=typeMap[u.type]||'未知';
      var rn=roleMap[u.role]||'普通员工';
      var st=statusText(u.status);var sc=statusColor(u.status);
      var ct=u.createTime?u.createTime.substring(0,19):'-';
      return '<tr><td>'+u.id+'</td><td>'+h(u.name)+'</td><td>'+h(u.phone)+'</td><td>'+tn+'</td><td>'+rn+'</td><td style="color:'+sc+'">'+st+'</td><td>'+ct+'</td><td class="action-btns"><button class="btn btn-sm btn-edit" onclick="openEdit('+u.id+')">编辑</button><button class="btn btn-sm btn-warn" onclick="resetPwd('+u.id+')">重置密码</button><button class="btn btn-sm btn-danger" onclick="delUser('+u.id+')">删除</button></td></tr>';
    }).join('');
  }).catch(function(){document.getElementById('dataTable').innerHTML='<tr class="empty-row"><td colspan="8">加载失败</td></tr>';});
}

function resetSearch(){document.getElementById('sName').value='';document.getElementById('sPhone').value='';loadList();}

function openAdd(){
  document.getElementById('modalTitle').textContent='新增用户';
  document.getElementById('editId').value='';
  document.getElementById('fName').value='';
  document.getElementById('fPhone').value='';
  document.getElementById('fType').value='10';
  document.getElementById('fStatus').value='1';
  document.getElementById('formModal').classList.add('show');
}

function openEdit(id){
  var list=document.getElementById('dataTable').rows;
  ajaxFetch('/user/list').then(function(r){return r.json();}).then(function(data){
    var u=data.find(function(x){return x.id==id;});
    if(!u){sToast('获取信息失败','error');return;}
    document.getElementById('modalTitle').textContent='编辑用户';
    document.getElementById('editId').value=u.id;
    document.getElementById('fName').value=u.name||'';
    document.getElementById('fPhone').value=u.phone||'';
    document.getElementById('fType').value=u.type!=null?String(u.type):'10';
    document.getElementById('fStatus').value=u.status!=null?String(u.status):'1';
    document.getElementById('formModal').classList.add('show');
  });
}

function closeModal(){document.getElementById('formModal').classList.remove('show');}

function save(){
  var id=document.getElementById('editId').value;
  var name=document.getElementById('fName').value.trim();
  var phone=document.getElementById('fPhone').value.trim();
  if(!name){sToast('请输入姓名','error');return;}
  if(!phone){sToast('请输入手机号','error');return;}
  var body={name:name,phone:phone,type:parseInt(document.getElementById('fType').value),status:parseInt(document.getElementById('fStatus').value)};
  var url='/user/add';
  if(id){body.id=parseInt(id);url='/user/upd';}
  ajaxFetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.json();}).then(function(resp){
      if(resp.code===200||resp.code===undefined){sToast(id?'更新成功':'添加成功','success');closeModal();loadList();}
      else{sToast(resp.msg||'操作失败','error');}
    }).catch(function(){sToast('网络错误','error');});
}

function delUser(id){if(!confirm('确定删除该用户？'))return;
  ajaxFetch('/user/del?uid='+id,{method:'POST'}).then(function(r){return r.json();}).then(function(resp){
    if(resp.code===200||resp.code===undefined){sToast('删除成功','success');loadList();}
    else{sToast(resp.msg||'操作失败','error');}
  }).catch(function(){sToast('网络错误','error');});
}

function resetPwd(id){if(!confirm('确定重置该用户的密码为123456？'))return;
  ajaxFetch('/user/reset-pwd?uid='+id,{method:'POST'}).then(function(r){return r.json();}).then(function(resp){
    if(resp.code===200||resp.code===undefined){sToast('密码已重置为123456','success');}
    else{sToast(resp.msg||'操作失败','error');}
  }).catch(function(){sToast('网络错误','error');});
}

initPage();
</script>
<script src="/js/session-ui.js"></script>
</body></html>
