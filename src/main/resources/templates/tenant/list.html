<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>诊所租户管理</title>
    <link rel="stylesheet" href="/css/session-ui.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f0f2f5;display:flex;min-height:100vh}
        .sidebar{width:220px;background:#001529;color:#fff;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column}
        .logo{padding:20px;text-align:center;font-size:18px;font-weight:600;border-bottom:1px solid rgba(255,255,255,.1)}
        .logo span{color:#1890ff}.sidebar nav{flex:1;padding:12px 0}
        .sidebar a{display:block;padding:14px 24px;color:rgba(255,255,255,.65);text-decoration:none;font-size:14px}
        .sidebar a.active,.sidebar a:hover{color:#fff;background:rgba(255,255,255,.08)}
        .logout{padding:16px 20px;border-top:1px solid rgba(255,255,255,.1)}
        .logout a{color:rgba(255,255,255,.45);text-decoration:none;font-size:13px}
        .main{margin-left:220px;flex:1;padding:24px}.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
        h2{font-size:20px;color:#333}.btn{padding:8px 18px;border:0;border-radius:6px;cursor:pointer;font-size:14px}
        .btn-primary{background:#1890ff;color:#fff}.card{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.05);overflow:hidden}
        table{width:100%;border-collapse:collapse}th,td{padding:12px 14px;text-align:left;border-bottom:1px solid #f0f0f0;font-size:13px}
        th{background:#fafafa;color:#666}tr:hover td{background:#f5f7fa}
        .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);align-items:center;justify-content:center;z-index:100}
        .modal.show{display:flex}.modal-body{width:440px;background:#fff;border-radius:8px;padding:22px}
        .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
        .close{border:0;background:none;font-size:22px;cursor:pointer;color:#999}
        .form-group{margin-bottom:14px}.form-group label{display:block;margin-bottom:6px;color:#555;font-size:13px}
        .form-group input{width:100%;padding:10px 12px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px}
        .modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
        .btn-cancel{background:#fff;border:1px solid #d9d9d9;color:#555}
        .toast{position:fixed;top:20px;right:20px;padding:12px 22px;border-radius:6px;color:#fff;display:none;z-index:2000}
        .toast.success{background:#52c41a}.toast.error{background:#ff4d4f}
    </style>
</head>
<body>
<aside class="sidebar">
    <div class="logo">平台<span>管理</span></div>
    <nav>
        <a href="/dashboard">仪表盘</a>
        <a href="/tenants" class="active">诊所租户</a>
        <a href="/audit" th:if="${session.currentUser != null and session.currentUser.auditViewer}">审计日志</a>
    </nav>
    <div class="session-user-box">
        <span class="session-user-name">当前用户：<span data-current-user-name>加载中...</span></span>
        <span class="session-user-role" data-current-user-role></span>
        <a href="#" class="session-logout" data-logout>退出登录</a>
    </div>
</aside>
<main class="main">
    <div class="page-header">
        <h2>诊所租户管理</h2>
        <button class="btn btn-primary" onclick="openCreate()">新增诊所</button>
    </div>
    <div class="card">
        <table>
            <thead><tr><th>诊所编码</th><th>诊所名称</th><th>状态</th><th>授权开始</th><th>授权结束</th><th>提前提醒</th><th>操作</th></tr></thead>
            <tbody id="tenantTable"><tr><td colspan="7">加载中...</td></tr></tbody>
        </table>
    </div>
</main>

<div class="modal" id="createModal">
    <div class="modal-body">
        <div class="modal-header"><h3>新增诊所</h3><button class="close" onclick="closeCreate()">×</button></div>
        <div class="form-group"><label>诊所编码 *</label><input id="fCode" placeholder="例如 clinic-a"></div>
        <div class="form-group"><label>诊所名称 *</label><input id="fName" placeholder="请输入诊所名称"></div>
        <div class="form-group"><label>管理员姓名 *</label><input id="fAdminName" placeholder="请输入管理员姓名"></div>
        <div class="form-group"><label>管理员手机号 *</label><input id="fAdminPhone" placeholder="请输入手机号"></div>
        <div class="form-group"><label>初始密码</label><input id="fAdminPassword" type="password" placeholder="默认 123456"></div>
        <div class="form-group"><label>授权开始时间 *</label><input id="fLicenseStart" type="datetime-local"></div>
        <div class="form-group"><label>授权结束时间 *</label><input id="fLicenseEnd" type="datetime-local"></div>
        <div class="form-group"><label>到期前提醒天数</label><input id="fWarningDays" type="number" min="0" value="30"></div>
        <div class="modal-footer">
            <button class="btn btn-cancel" onclick="closeCreate()">取消</button>
            <button class="btn btn-primary" onclick="createTenant()">创建</button>
        </div>
    </div>
</div>

<div class="modal" id="licenseModal">
    <div class="modal-body">
        <div class="modal-header"><h3>编辑授权期</h3><button class="close" onclick="closeLicense()">×</button></div>
        <input type="hidden" id="licenseTenantId">
        <div class="form-group"><label>授权开始时间 *</label><input id="editLicenseStart" type="datetime-local"></div>
        <div class="form-group"><label>授权结束时间 *</label><input id="editLicenseEnd" type="datetime-local"></div>
        <div class="form-group"><label>到期前提醒天数</label><input id="editWarningDays" type="number" min="0" value="30"></div>
        <div class="modal-footer">
            <button class="btn btn-cancel" onclick="closeLicense()">取消</button>
            <button class="btn btn-primary" onclick="saveLicense()">保存</button>
        </div>
    </div>
</div>
<div class="toast" id="toast"></div>
<script>
    var STATUS_ENABLED = 1;
    function h(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
    function toast(message,type){var el=document.getElementById('toast');el.textContent=message;el.className='toast '+(type||'success');el.style.display='block';setTimeout(function(){el.style.display='none';},2500);}
    function api(url,options){options=options||{};options.headers=options.headers||{};options.headers['X-Requested-With']='XMLHttpRequest';return fetch(url,options).then(function(r){if(r.status===401){location.href='/login';throw new Error('未登录');}if(r.status===403){throw new Error('无权限');}return r.json();});}
    function loadTenants(){
        api('/api/tenants').then(function(data){
            var rows=data.data||[];
            document.getElementById('tenantTable').innerHTML=rows.length?rows.map(function(t){
                return '<tr><td>'+h(t.code)+'</td><td>'+h(t.name)+'</td><td>'+(t.status===STATUS_ENABLED?'正常':'停用')+'</td><td>'+h(t.licenseStartTime||'-')+'</td><td>'+h(t.licenseEndTime||'-')+'</td><td>'+(t.licenseWarningDays==null?30:t.licenseWarningDays)+'天</td><td><button class="btn" onclick="openLicense('+t.id+',\''+h(t.licenseStartTime||'')+'\',\''+h(t.licenseEndTime||'')+'\','+(t.licenseWarningDays==null?30:t.licenseWarningDays)+')">编辑授权</button></td></tr>';
            }).join(''):'<tr><td colspan="7">暂无数据</td></tr>';
        }).catch(function(error){document.getElementById('tenantTable').innerHTML='<tr><td colspan="7">'+h(error.message)+'</td></tr>';});
    }
    function openCreate(){document.getElementById('createModal').classList.add('show');}
    function closeCreate(){document.getElementById('createModal').classList.remove('show');}
    function createTenant(){
        var now=new Date();
        var end=new Date(now.getTime()+365*24*60*60*1000);
        var body={
            code:document.getElementById('fCode').value.trim(),
            name:document.getElementById('fName').value.trim(),
            adminName:document.getElementById('fAdminName').value.trim(),
            adminPhone:document.getElementById('fAdminPhone').value.trim(),
            adminPassword:document.getElementById('fAdminPassword').value.trim(),
            licenseStartTime:document.getElementById('fLicenseStart').value||formatLocal(now),
            licenseEndTime:document.getElementById('fLicenseEnd').value||formatLocal(end),
            licenseWarningDays:parseInt(document.getElementById('fWarningDays').value||'30')
        };
        if(!body.code||!body.name||!body.adminName||!body.adminPhone){toast('请填写必填项','error');return;}
        if(!/^1[3-9]\d{9}$/.test(body.adminPhone)){toast('请输入正确的管理员手机号码','error');return;}
        api('/api/tenants',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
            .then(function(resp){
                if(resp.code!==200){toast(resp.msg||'创建失败','error');return;}
                toast('诊所创建成功');
                closeCreate();
                loadTenants();
            })
            .catch(function(error){toast(error.message||'创建失败','error');});
    }
    function formatLocal(date){
        var pad=function(n){return n<10?'0'+n:''+n;};
        return date.getFullYear()+'-'+pad(date.getMonth()+1)+'-'+pad(date.getDate())+'T'+pad(date.getHours())+':'+pad(date.getMinutes());
    }
    function openLicense(id,start,end,days){
        document.getElementById('licenseTenantId').value=id;
        document.getElementById('editLicenseStart').value=(start||'').replace(' ','T').substring(0,16);
        document.getElementById('editLicenseEnd').value=(end||'').replace(' ','T').substring(0,16);
        document.getElementById('editWarningDays').value=days;
        document.getElementById('licenseModal').classList.add('show');
    }
    function closeLicense(){document.getElementById('licenseModal').classList.remove('show');}
    function saveLicense(){
        var body={
            tenantId:parseInt(document.getElementById('licenseTenantId').value),
            licenseStartTime:document.getElementById('editLicenseStart').value,
            licenseEndTime:document.getElementById('editLicenseEnd').value,
            licenseWarningDays:parseInt(document.getElementById('editWarningDays').value||'30')
        };
        api('/api/tenants/license',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
            .then(function(resp){if(resp.code!==200){toast(resp.msg||'保存失败','error');return;}toast('授权期已更新');closeLicense();loadTenants();})
            .catch(function(error){toast(error.message||'保存失败','error');});
    }
    function logout(){fetch('/api/logout',{method:'POST'}).then(function(){location.href='/login';});}
    loadTenants();
</script>
<script src="/js/session-ui.js"></script>
</body>
</html>
