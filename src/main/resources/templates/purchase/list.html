<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>进货管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f0f2f5;display:flex;min-height:100vh}
.sidebar{width:220px;background:#001529;color:#fff;position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column}
.sidebar .logo{padding:20px;font-size:18px;font-weight:600;border-bottom:1px solid rgba(255,255,255,0.1);text-align:center}.sidebar .logo span{color:#1890ff}
.sidebar nav{flex:1;padding:12px 0}.sidebar nav a{display:block;padding:14px 24px;color:rgba(255,255,255,0.65);text-decoration:none;font-size:14px;transition:all 0.2s}
.sidebar nav a:hover,.sidebar nav a.active{color:#fff;background:rgba(255,255,255,0.08)}
.main{margin-left:220px;flex:1;padding:24px}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.page-header h2{font-size:20px;color:#333}
.btn{padding:8px 20px;border-radius:6px;border:none;cursor:pointer;font-size:14px;transition:opacity 0.2s}.btn:hover{opacity:0.85}
.btn-primary{background:#1890ff;color:#fff}.btn-danger{background:#ff4d4f;color:#fff}.btn-sm{padding:4px 12px;font-size:12px}.btn-success{background:#52c41a;color:#fff}
.search-bar{background:#fff;padding:16px;border-radius:8px;margin-bottom:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;box-shadow:0 1px 4px rgba(0,0,0,0.05)}
.search-bar label{font-size:13px;color:#666;margin-bottom:4px;display:block}
.search-bar input,.search-bar select{padding:8px 12px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;width:160px}
.search-bar input:focus,.search-bar select:focus{outline:none;border-color:#1890ff}
.table-card{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,0.05);overflow:hidden}
table{width:100%;border-collapse:collapse}thead{background:#fafafa}
th{padding:12px 16px;text-align:left;font-weight:600;font-size:13px;color:#666;border-bottom:1px solid #f0f0f0}
td{padding:12px 16px;font-size:13px;color:#333;border-bottom:1px solid #f0f0f0}tr:hover td{background:#f5f7fa}
.action-btns{display:flex;gap:6px}.empty-row td{text-align:center;color:#999;padding:40px}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.45);z-index:1000;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}.modal{background:#fff;border-radius:8px;width:680px;max-height:90vh;overflow-y:auto;box-shadow:0 4px 24px rgba(0,0,0,0.15)}
.modal-header{padding:16px 24px;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center}.modal-header h3{font-size:16px;color:#333}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:#999}
.modal-body{padding:24px}.modal-footer{padding:12px 24px;border-top:1px solid #f0f0f0;display:flex;justify-content:flex-end;gap:8px}
.modal-footer .btn-cancel{background:#fff;border:1px solid #d9d9d9;padding:8px 20px;border-radius:6px;cursor:pointer;font-size:14px}
.form-group{margin-bottom:14px}.form-group label{display:block;font-size:13px;color:#666;margin-bottom:5px}
.form-group input,.form-group select{width:100%;padding:8px 12px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;box-sizing:border-box}
.form-group input:focus,.form-group select:focus{outline:none;border-color:#1890ff}
.form-row{display:flex;gap:12px}.form-row .form-group{flex:1}
.inline-search{display:flex;gap:8px;align-items:center;margin:8px 0}
.inline-search input{padding:8px 12px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;flex:1}
.search-list{max-height:160px;overflow-y:auto;border:1px solid #d9d9d9;border-radius:6px;display:none;margin-bottom:8px}
.search-list .item{padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid #f0f0f0}
.search-list .item:hover{background:#e6f7ff}
.toast{position:fixed;top:20px;right:20px;padding:12px 24px;border-radius:6px;color:#fff;font-size:14px;z-index:2000;display:none;animation:slideIn 0.3s}
.toast.success{background:#52c41a}.toast.error{background:#ff4d4f}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.section-title{font-size:14px;font-weight:600;color:#333;padding:8px 0;border-bottom:1px solid #f0f0f0;margin-bottom:12px}
.new-drug-form{display:none;background:#f9f9f9;padding:12px;border-radius:6px;margin-top:8px}
</style></head>
<body>
<aside class="sidebar"><div class="logo">诊所<span>管理</span></div><nav>
<a href="/dashboard">📊 仪表盘</a><a href="/patients">👤 患者管理</a><a href="/physic">💊 药品/耗材</a>
<a href="/purchase" class="active">📦 进货管理</a><a href="/prescription">📋 处方管理</a>
<a href="/inventory">🏪 库存查询</a>
<a href="/selling-price">💰 售价管理</a><a href="/report">📈 报表统计</a><a href="/user">👥 用户管理</a>
</nav></aside>

<div class="main">
<div class="page-header"><h2>📦 进货管理</h2><button class="btn btn-primary" onclick="openAdd()">+ 新增批次</button></div>
<div class="table-card"><table>
<thead><tr><th>批次ID</th><th>进货人</th><th>创建时间</th><th>状态</th><th>操作</th></tr></thead>
<tbody id="batchTable"><tr class="empty-row"><td colspan="5">加载中...</td></tr></tbody>
</table></div></div>

<div class="modal-overlay" id="detailModal"><div class="modal">
<div class="modal-header"><h3 id="detailTitle">批次明细</h3><button class="modal-close" onclick="closeDetail()">×</button></div>
<div class="modal-body">
<div id="batchInfo" class="form-group" style="color:#666;font-size:13px"></div>
<div class="section-title">已购药品/耗材</div>
<div id="drugList" style="margin-bottom:12px"><p style="text-align:center;color:#999">加载中...</p></div>

<div class="section-title">添加药品到本批次</div>
<div class="inline-search">
<input id="drugSearch" placeholder="搜索药品名称" oninput="searchDrugs()">
<button class="btn btn-sm btn-success" onclick="showNewDrug()">+ 新增药品</button>
</div>
<div class="search-list" id="drugSearchList"></div>
<div id="addForm" style="display:none">
<div class="form-row">
<div class="form-group"><label>药品名称</label><input id="selDrugName" readonly></div>
<div class="form-group"><label>进货单价</label><input id="buyPrice" type="number" step="0.01" placeholder="0.00"></div>
<div class="form-group"><label>数量</label><input id="buyQty" type="number" min="1" value="1"></div>
</div>
<input type="hidden" id="selDrugId">
<div><button class="btn btn-primary" onclick="submitAdd()">确认添加</button></div>
</div>

<div class="new-drug-form" id="newDrugForm">
<div class="form-row">
<div class="form-group"><label>名称 *</label><input id="ndName" placeholder="药品名称"></div>
<div class="form-group"><label>类型</label><select id="ndType"><option value="10">药品</option><option value="20">耗材</option></select></div>
<div class="form-group"><label>单位</label><select id="ndUnit"><option value="1">个</option><option value="2">瓶</option><option value="3">盒</option><option value="4">袋</option><option value="11">毫克</option><option value="12">克</option><option value="13">千克</option><option value="21">毫升</option><option value="22">升</option></select></div>
</div>
<div class="form-group"><label>别名</label><input id="ndAlias" placeholder="别名(选填)"></div>
<div class="form-group"><label>厂商</label><input id="ndManufacturer" placeholder="生产厂商(选填)"></div>
<div style="display:flex;gap:8px"><button class="btn btn-primary" onclick="submitNewDrug()">保存药品</button><button class="btn" style="border:1px solid #d9d9d9" onclick="hideNewDrug()">取消</button></div>
</div>
</div>
<div class="modal-footer"><button class="btn-cancel" onclick="closeDetail()">关闭</button></div></div></div>

<div class="toast" id="toast"></div>
<script>
var currentBatchId=null,drugs=[],physicList=[];
function statusText(s){return s===1?"正常":s===0?"待设置":s===-1?"停用":s===2?"占用":"未知";}function statusColor(s){return s===1?"#52c41a":s===0?"#faad14":s===-1?"#ff4d4f":s===2?"#1890ff":"#999";}
function sToast(m,t){var e=document.getElementById('toast');e.textContent=m;e.className='toast '+t;e.style.display='block';setTimeout(function(){e.style.display='none'},2500);}
function h(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function load(){
  document.getElementById('batchTable').innerHTML='<tr class="empty-row"><td colspan="5">加载中...</td></tr>';
  fetch('/pb/list').then(r=>r.json()).then(function(d){
    var t=document.getElementById('batchTable');
    if(!d||!d.length){t.innerHTML='<tr class="empty-row"><td colspan="5">暂无数据</td></tr>';return;}
    t.innerHTML=d.map(function(b){
      var st=statusText(b.status);var sc=statusColor(b.status);
      return '<tr><td>'+b.id+'</td><td>'+h(b.user||'')+'</td><td>'+(b.createTime?b.createTime.substring(0,19):'-')+'</td><td style="color:'+sc+'">'+st+'</td><td class="action-btns"><button class="btn btn-sm btn-primary" onclick="showDetail('+b.id+')">明细</button><button class="btn btn-sm btn-danger" onclick="delBatch('+b.id+')">删除</button></td></tr>';
    }).join('');
  }).catch(function(){document.getElementById('batchTable').innerHTML='<tr class="empty-row"><td colspan="5">加载失败</td></tr>';});
}

function openAdd(){
  fetch('/api/user/current').then(r=>r.json()).then(function(resp){
    if(resp.code!==200){sToast('未登录','error');return;}
    fetch('/pb/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:parseInt(resp.data.id)})})
    .then(r=>r.json()).then(function(){sToast('批次创建成功','success');load();}).catch(function(){sToast('创建失败','error');});
  }).catch(function(){sToast('获取用户信息失败','error');});
}

function delBatch(id){if(!confirm('确定删除该批次？'))return;
  fetch('/pb/del?id='+id,{method:'POST'}).then(r=>r.json()).then(function(){sToast('删除成功','success');load();}).catch(function(){sToast('删除失败','error');});
}

var editingPhysicId=null;
function showDetail(batchId){
  currentBatchId=batchId;
  document.getElementById('detailTitle').textContent='批次明细 #'+batchId;
  document.getElementById('batchInfo').textContent='批次ID: '+batchId;
  document.getElementById('drugList').innerHTML='<p style="text-align:center;color:#999">加载中...</p>';
  document.getElementById('addForm').style.display='none';
  document.getElementById('newDrugForm').style.display='none';
  document.getElementById('detailModal').classList.add('show');
  fetch('/pd/batchSummary?batchId='+batchId).then(r=>r.json()).then(function(d){
    drugs=d||[];
    var html='<table><thead><tr><th>药品</th><th>进货价</th><th>数量</th><th>可用</th><th>已占用</th><th>操作</th></tr></thead><tbody>';
    if(!drugs.length){html+='<tr class="empty-row"><td colspan="6">暂无药品</td></tr>';}
    else{drugs.forEach(function(item){
  if(editingPhysicId==item.physicId){
    html+='<tr><td>'+h(item.physicName)+(item.physicAlias?' ('+h(item.physicAlias)+')':'')+'</td><td><input id="ep_'+item.physicId+'" type="number" step="0.01" value="'+item.buyingPrice+'" style="width:70px;padding:4px;border:1px solid #d9d9d9;border-radius:4px;font-size:12px"></td><td><input id="eq_'+item.physicId+'" type="number" value="'+item.quantity+'" style="width:50px;padding:4px;border:1px solid #d9d9d9;border-radius:4px;font-size:12px"></td><td style="color:#52c41a">'+item.availableQty+'</td><td style="color:#1890ff">'+item.occupiedQty+'</td><td class="action-btns"><button class="btn btn-sm btn-success" onclick="saveEdit('+item.physicId+')">保存</button><button class="btn btn-sm" style="border:1px solid #d9d9d9" onclick="cancelEdit()">取消</button></td></tr>';
  }else{
    html+='<tr><td>'+h(item.physicName)+(item.physicAlias?' ('+h(item.physicAlias)+')':'')+'</td><td>'+item.buyingPrice+'</td><td>'+item.quantity+'</td><td style="color:#52c41a">'+item.availableQty+'</td><td style="color:#1890ff">'+item.occupiedQty+'</td><td class="action-btns"><button class="btn btn-sm btn-primary" onclick="startEdit('+item.physicId+')">编辑</button><button class="btn btn-sm btn-danger" onclick="deleteDrug('+item.physicId+')">删除</button></td></tr>';
  }});}
    html+='</tbody></table>';
    document.getElementById('drugList').innerHTML=html;
  }).catch(function(){document.getElementById('drugList').innerHTML='<p style="text-align:center;color:#999">加载失败</p>';});
}

function searchDrugs(){
  var q=document.getElementById('drugSearch').value.trim();
  var list=document.getElementById('drugSearchList');
  if(!q){list.style.display='none';return;}
  fetch('/physic/list?name='+encodeURIComponent(q)).then(r=>r.json()).then(function(d){
    physicList=d||[];var html='';
    if(!physicList.length){html='<div class="item" style="color:#999;cursor:default">未找到，请点击"新增药品"</div>';}
    else{physicList.forEach(function(p){html+='<div class="item" onclick="selectDrug('+p.id+',\''+h(p.name)+'\')">'+h(p.name)+(p.alias?' ('+h(p.alias)+')':'')+'</div>';});}
    list.innerHTML=html;list.style.display='block';
  }).catch(function(){});}

function selectDrug(id,name){
  document.getElementById('selDrugId').value=id;
  document.getElementById('selDrugName').value=name;
  document.getElementById('buyPrice').value='';
  document.getElementById('buyQty').value='1';
  document.getElementById('drugSearchList').style.display='none';
  document.getElementById('addForm').style.display='block';
}

function submitAdd(){
  var pid=document.getElementById('selDrugId').value;
  var price=parseFloat(document.getElementById('buyPrice').value);
  var qty=parseInt(document.getElementById('buyQty').value);
  if(!pid){sToast('请选择药品','error');return;}
  if(!price||price<=0){sToast('请输入有效进货价','error');return;}
  if(!qty||qty<1){sToast('请输入有效数量','error');return;}
  fetch('/pd/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch:currentBatchId,physic:parseInt(pid),buyingPrice:price,num:qty})})
  .then(r=>r.json()).then(function(){sToast('添加成功','success');document.getElementById('drugSearch').value='';document.getElementById('addForm').style.display='none';showDetail(currentBatchId);})
  .catch(function(){sToast('添加失败','error');});
}

function showNewDrug(){
  document.getElementById('newDrugForm').style.display='block';
  document.getElementById('ndName').value='';
  document.getElementById('ndType').value='10';
  document.getElementById('ndUnit').value='1';
  document.getElementById('ndAlias').value='';
  document.getElementById('ndManufacturer').value='';
}
function hideNewDrug(){document.getElementById('newDrugForm').style.display='none';}
function submitNewDrug(){
  var name=document.getElementById('ndName').value.trim();
  if(!name){sToast('请输入药品名称','error');return;}
  fetch('/physic/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name,type:parseInt(document.getElementById('ndType').value),unit:parseInt(document.getElementById('ndUnit').value),alias:document.getElementById('ndAlias').value.trim(),manufacturer:document.getElementById('ndManufacturer').value.trim()})})
  .then(r=>r.json()).then(function(){
    sToast('药品创建成功','success');
    hideNewDrug();
    document.getElementById('drugSearch').value=name;
    searchDrugs();
  }).catch(function(){sToast('创建失败','error');});
}
function startEdit(pid){editingPhysicId=pid;showDetail(currentBatchId);}
function cancelEdit(){editingPhysicId=null;showDetail(currentBatchId);}
function saveEdit(pid){
  var p=document.getElementById('ep_'+pid).value;
  var q=document.getElementById('eq_'+pid).value;
  if(!p||p<=0){sToast('请输入有效价格','error');return;}
  if(!q||q<1){sToast('请输入有效数量','error');return;}
  fetch('/pd/upd',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch:currentBatchId,physic:pid,buyingPrice:parseFloat(p),num:parseInt(q)})})
  .then(function(r){return r.json();}).then(function(){sToast('更新成功','success');editingPhysicId=null;showDetail(currentBatchId);})
  .catch(function(){sToast('更新失败','error');});
}
function deleteDrug(pid){
  if(!confirm('确定从该批次中删除此药品？'))return;
  fetch('/pd/del?pbid='+currentBatchId+'&pid='+pid,{method:'POST'})
  .then(function(r){return r.json();}).then(function(){sToast('删除成功','success');showDetail(currentBatchId);})
  .catch(function(){sToast('删除失败','error');});
}
function closeDetail(){document.getElementById('detailModal').classList.remove('show');currentBatchId=null;}

load();
</script></body></html>
